<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121b2e"><link rel="manifest" href="manifest.webmanifest"><title>パチイベNAVI</title><style>body{margin:0;background:#0d1423;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:720px;margin:auto;padding:20px 16px 80px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:8px 0}p,small{color:#a8b4c9}.panel{background:#18243a;border:1px solid #2a3a56;border-radius:16px;padding:16px;margin:14px 0}button,select,input{font:inherit;border-radius:10px;border:1px solid #40506b;padding:11px;background:#202e47;color:white}button{cursor:pointer}.active{background:#4266df;border-color:#4266df}nav{display:flex;gap:8px;flex-wrap:wrap}input{box-sizing:border-box;width:100%}.card{border-top:1px solid #34435c;padding:15px 0}.card:first-child{border:0}.tag{display:inline-block;font-size:12px;border-radius:20px;background:#34435c;padding:5px 9px;margin:3px 5px 3px 0}.muted{color:#a8b4c9}.star{float:right}a{color:#91b6ff}.empty{text-align:center;padding:25px 5px;color:#b7c2d5}</style></head><body><main><header><div><small>奈良県・大阪府 対応</small><h1>パチイベNAVI</h1></div><span>📅</span></header><p>公開イベント情報の確認・管理アプリ（自動収集は準備中）</p><div class="panel"><nav id="days"><button data-days="0" class="active">今日</button><button data-days="1">明日</button><button data-days="7">今週</button></nav><p><input id="date" type="date" aria-label="日付指定"></p><nav><select id="pref"><option value="">奈良・大阪すべて</option><option>奈良県</option><option>大阪府</option></select><select id="type"><option value="">全イベント</option><option>来店</option><option>取材</option><option>周年</option><option>旧イベント日</option><option>その他</option></select></nav><p><input id="query" placeholder="店舗名・市区町村で検索"></p><label><input id="favorites" type="checkbox" style="width:auto"> お気に入りのみ</label></div><div class="panel"><strong>イベント一覧</strong><div id="results"></div></div><div class="panel"><strong>イベント情報を登録</strong><p>公式告知などで確認したイベントを端末内に記録できます。自動収集機能は今後の拡張対象です。</p><form id="form"><p><input id="shop" placeholder="店舗名" required></p><p><select id="formPref"><option>奈良県</option><option>大阪府</option></select> <input id="city" placeholder="市区町村" required></p><p><input id="eventDate" type="date" required></p><p><select id="eventType"><option>来店</option><option>取材</option><option>周年</option><option>旧イベント日</option><option>その他</option></select></p><p><input id="detail" placeholder="イベント名・詳細" required></p><p><input id="source" type="url" placeholder="情報元URL（https://...）" required></p><p><select id="confidence"><option value="公式確認">公式確認</option><option value="第三者掲載">第三者掲載</option><option value="傾向・未確認">傾向・未確認</option></select></p><button type="submit" class="active">端末に保存</button></form></div><small>※ 初期状態ではイベントデータは未登録です。掲載内容は実施・設定投入・勝利を保証しません。データはこのブラウザ内に保存されます。</small><section class="panel"><h2>公開イベントを探す</h2><p>検索結果は外部サイトで確認してください。掲載情報は主催者・店舗の公式告知と照合してください。</p><p><a href="https://www.google.com/search?q=%E5%A5%88%E8%89%AF%E7%9C%8C+%E3%83%91%E3%83%81%E3%83%B3%E3%82%B3+%E6%9D%A5%E5%BA%97+%E5%8F%96%E6%9D%90+%E4%BB%8A%E6%97%A5" target="_blank" rel="noopener">奈良県のイベントを検索 ↗</a></p><p><a href="https://www.google.com/search?q=%E5%A4%A7%E9%98%AA%E5%BA%9C+%E3%83%91%E3%83%81%E3%83%B3%E3%82%B3+%E6%9D%A5%E5%BA%97+%E5%8F%96%E6%9D%90+%E4%BB%8A%E6%97%A5" target="_blank" rel="noopener">大阪府のイベントを検索 ↗</a></p><small>検索結果はリアルタイムの開催確認を保証しません。</small></section></main><script>const $=id=>document.getElementById(id),key='pachi-navi-events-v1',favKey='pachi-navi-favorites-v1';let entries=JSON.parse(localStorage.getItem(key)||'[]'),favs=JSON.parse(localStorage.getItem(favKey)||'[]'),days=0;const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=()=>localDate(new Date());function render(){let start=$('date').value||today(),end=new Date(start+'T12:00:00');end.setDate(end.getDate()+(days===7?6:0));let max=localDate(end),q=$('query').value.trim().toLowerCase();let list=entries.filter(x=>x.date>=start&&x.date<=max&&(!$('pref').value||x.pref===$('pref').value)&&(!$('type').value||x.type===$('type').value)&&(!q||(x.shop+' '+x.city+' '+x.detail).toLowerCase().includes(q))&&(!$('favorites').checked||favs.includes(x.shop))).sort((a,b)=>a.date.localeCompare(b.date));$('results').replaceChildren();if(!list.length){let el=document.createElement('div');el.className='empty';el.textContent='登録されたイベントはありません。情報を登録するとここに表示されます。';$('results').append(el)}list.forEach(x=>{let div=document.createElement('div');div.className='card';let h=document.createElement('strong');h.textContent=x.shop;div.append(h);let b=document.createElement('button');b.className='star';b.textContent=favs.includes(x.shop)?'★':'☆';b.setAttribute('aria-label','お気に入り切替');b.onclick=()=>{favs=favs.includes(x.shop)?favs.filter(v=>v!==x.shop):[...favs,x.shop];localStorage.setItem(favKey,JSON.stringify(favs));render()};div.append(b);let p=document.createElement('p');p.textContent=x.date+' ・ '+x.pref+' '+x.city;div.append(p);let detail=document.createElement('div');detail.textContent=x.detail;div.append(detail);[x.type,x.confidence].forEach(t=>{let tag=document.createElement('span');tag.className='tag';tag.textContent=t;div.append(tag)});let link=document.createElement('p'),a=document.createElement('a');a.textContent='情報元を開く ↗';a.href=x.source;a.target='_blank';a.rel='noopener noreferrer';link.append(a);div.append(link);let sm=document.createElement('small');sm.textContent='登録日: '+x.saved;div.append(sm);let del=document.createElement('button');del.textContent='削除';del.style.float='right';del.onclick=()=>{if(confirm('この情報を削除しますか？')){entries=entries.filter(e=>e.id!==x.id);localStorage.setItem(key,JSON.stringify(entries));render()}};div.append(del);$('results').append(div)})}function setDay(n){days=n;let d=new Date();d.setDate(d.getDate()+(n===1?1:0));$('date').value=localDate(d);document.querySelectorAll('[data-days]').forEach(b=>b.classList.toggle('active',Number(b.dataset.days)===n));render()}document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>setDay(Number(b.dataset.days)));['date','pref','type','query','favorites'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='date'){days=0;document.querySelectorAll('[data-days]').forEach(b=>b.classList.remove('active'))}render()}));$('form').onsubmit=e=>{e.preventDefault();let x={id:Date.now()+'-'+Math.random(),shop:$('shop').value.trim(),pref:$('formPref').value,city:$('city').value.trim(),date:$('eventDate').value,type:$('eventType').value,detail:$('detail').value.trim(),source:$('source').value,confidence:$('confidence').value,saved:today()};if(!x.source.startsWith('https://')){alert('https:// で始まるURLを入力してください');return}entries.push(x);localStorage.setItem(key,JSON.stringify(entries));$('form').reset();$('date').value=x.date;days=0;render()};setDay(0);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
